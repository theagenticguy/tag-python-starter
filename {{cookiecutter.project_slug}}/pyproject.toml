[project]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.project_description}}"
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = ["boto3>=1.40.29", "loguru>=0.7.3", "pydantic>=2.11.7"]

[dependency-groups]
dev = [
    "boto3-stubs[all]>=1.40.29",
    "commitizen>=4.9.1",
    "mypy>=1.17.1",
    "poethepoet>=0.37.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-api-autonav>=0.4.0",
    "mkdocs-llmstxt>=0.3.1",
    "mkdocs-macros-plugin>=1.3.9",
    "mkdocs-material>=9.6.19",
    "mkdocstrings>=0.30.0",
    "mkdocstrings-python>=1.18.2",
    "pymdown-extensions>=10.16.1",
]

scan = ["bandit>=1.8.6", "pip-audit>=2.9.0"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb", "**/__init__.py"]
target-version = "py313"
exclude = [
    ".venv",
    "venv",
    "**/__pycache__",
    "**/node_modules",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.coverage",
    "**/dist",
    "**/build",
    "**/env",
    "**/.venv",
    "**/.ipynb_checkpoints",
]
force-exclude = true

[tool.ruff.lint]
exclude = ["__init__.py", "**/__init__.py"]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "C901", # too complex
    "E501", # line too long
    "E741", # ambiguous variable name
    "F402", # unused import
    "F823", # missing type stubs
    "D100", # missing docstring in public module
    "D106", # missing docstring in public function
]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.isort]
lines-after-imports = 2
no-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["F704"]
"tests/**/*.py" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
strict = true
exclude = [
    "venv",
    ".venv",
    ".*/__pycache__",
    ".*/node_modules",
    ".*/.mypy_cache",
    ".*/.pytest_cache",
    ".*/.ruff_cache",
    ".*/.coverage",
    ".*/dist",
]

[tool.pyright]
include = ["src"]
exclude = [
    "venv",
    ".venv",
    "**/__pycache__",
    "**/node_modules",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.coverage",
    "**/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -n auto"
filterwarnings = [
    "ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
skip_covered = true
show_missing = true
precision = 2
exclude_lines = [
    'def __repr__',
    'pragma= no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING=',
    'if typing.TYPE_CHECKING=',
    '@overload',
    '@typing.overload',
    '\(Protocol\)=$',
    'typing.assert_never',
    'assert_never',
    'if __name__ == .__main__.=',
]

[tool.coverage.paths]
include = ["src/**/*.py"]

[tool.bandit]
exclude_dirs = ["venv", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "src/{{cookiecutter.package_name}}/__init__.py:__version__",
    "pyproject.toml:version",
]

[tool.poe]
executor.type = "uv"

[tool.poe.tasks]

# QUALITY
format = "ruff format src tests"
lint = "ruff check --fix src tests"
typecheck = "mypy src"
code-quality = { sequence = [
    "format",
    "lint",
    "typecheck",
], help = "run quality checks" }

# SECURITY
pip-audit = "pip-audit --skip-editable"
bandit = "bandit -r src tests -c pyproject.toml -q"
semgrep = "uvx semgrep@latest --config 'p/default' --error --skip-unknown-extensions"
scan = { sequence = [
    "pip-audit",
    "bandit",
    "semgrep",
], help = "run security scans" }

# TESTING
test = { cmd = "pytest --asyncio-mode=auto -q", help = "run tests" }
cov = { cmd = "pytest --asyncio-mode=auto --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85", help = "run tests w/ coverage + XML artifact" }

# JAVASCRIPT ASSETS
download-mermaid = { shell = "mkdir -p docs/mkdocs/assets/js && curl -sSL https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.min.js -o docs/mkdocs/assets/js/mermaid.min.js", help = "download latest mermaid.min.js" }
download-feather = { shell = "mkdir -p docs/mkdocs/assets/js && curl -sSL https://cdn.jsdelivr.net/npm/feather-icons@latest/dist/feather.min.js -o docs/mkdocs/assets/js/feather.min.js", help = "download latest feather.min.js" }
download-js-assets = { sequence = [
    "download-mermaid",
    "download-feather",
], help = "download all javascript assets" }
build-css = { cmd = "npx @tailwindcss/cli -i ./docs/mkdocs/stylesheets/extra.css -o ./docs/mkdocs/stylesheets/output.css" }

# DOCUMENTATION
docs-assets = { sequence = [
    "download-js-assets",
    "build-css",
], help = "download all javascript assets and build css" }
docs-dev = { sequence = [
    "docs-assets",
    { cmd = "mkdocs serve -a localhost:8080", help = "serve documentation" },
], help = "serve documentation" }
docs-build = { sequence = [
    "docs-assets",
    { cmd = "mkdocs build", help = "build documentation" },
], help = "build documentation" }
docs-deploy = { sequence = [
    "docs-assets",
    { cmd = "mkdocs gh-deploy", help = "deploy documentation" },
], help = "deploy documentation" }
docs-clean = { cmd = "rm -rf site", help = "clean documentation" }
